packages:
  - apps/*
  - infra
  - packages/*

allowBuilds:
  core-js-pure: false
  '@google/genai': true
  '@mongodb-js/zstd': true
  esbuild: true
  node-liblzma: true
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@pierre/diffs@1.6.2'
  - '@pierre/highlights@0.3.0'

patchedDependencies:
  '@cloudflare/computer@0.8.0': patches/@cloudflare__computer@0.8.0.patch
  '@cloudflare/vitest-plugin@1.4.8': patches/@cloudflare__vitest-plugin@1.4.8.patch
  '@alchemy.run/cloudflare@2.0.0-beta.84': patches/@alchemy.run__cloudflare@2.0.0-beta.84.patch
