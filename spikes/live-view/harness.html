<!doctype html>
<html lang="en">
  <head>

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/icon.svg?t=__TOKEN__" />
    <title>Live View spike (#152)</title>
    <style>
      body {
        font:
          14px/1.35 system-ui,
          sans-serif;
        margin: 0;
        padding: 8px;
        padding-top: max(8px, env(safe-area-inset-top));
        background: #111;
        color: #eee;
      }
      button {
        font: inherit;
        padding: 8px 10px;

        border-color: #f38020;

      #log {

          11px/1.3 ui-monospace,

        padding: 4px;
      }

        margin-top: 6px;
      }
      #screen {
        display: block;
        width: 100%;
        touch-action: none;
        background: #333;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #kbd {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;

      .picker {
        position: absolute;

        z-index: 5;

      #edit-menu {
        position: absolute;
        display: none;
        z-index: 6;
        background: #1c1c1e;
        border-radius: 9px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        white-space: nowrap;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      #edit-menu button {
        background: none;
        color: #fff;
        border: 0;
        border-left: 1px solid #48484a;
        border-radius: 0;
        margin: 0;
        padding: 10px 14px;
        font:
          15px system-ui,
          sans-serif;
      }
      #edit-menu button:first-child {
        border-left: 0;
      }
      #edit-menu button.down {
        background: #48484a;
      }
      button.attn {
        background: #f38020;
        color: #000;
      }
      #kbdstate,
      #bgtable {
        font:
          12px ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      .small {
        font-size: 12px;
        color: #aaa;
      }
    </style>

  <body>
    <div id="env" class="small"></div>
    <div>
      <button id="setup">Setup / reuse session</button>

    <h2>Desktop checks</h2>
    <div>
      <button data-check="10">10 viewport</button>

      <button id="runall">Run all</button>

    </div>

    <h2>iPhone</h2>
    <div>
      <button class="phone" data-check="1">1 connect</button>
      <button class="phone" id="bgstart">9 background test</button>
      <button class="phone" id="vopen">11/12 open viewer</button>
      <button class="phone" id="vclose">close viewer</button>
    </div>
    <div id="bgtable"></div>

    <div id="viewer">
      <canvas id="screen"></canvas>
      <textarea
        id="kbd"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        aria-hidden="true"
      ></textarea>
      <select id="pick-select" class="picker"></select>
      <input id="pick-input" class="picker" />
      <div id="edit-menu" role="menu"></div>
      <div>
        <button class="phone" id="vcopy">Copy (11)</button>
        <button id="vsel">Read tab selection</button>
        <button class="phone" id="vkbd">⌨︎ force</button>
        <button class="phone" id="vblur">Blur (12)</button>
        <button class="phone" id="vmode">inputmode: text</button>
        <button class="phone" id="vhint">enterkeyhint: enter</button>
        <button class="phone" id="vcap">autocapitalize: sentences</button>
        <button id="vscroll">scroll tab to top</button>
        <button class="phone" id="vlp">long press: touch events</button>
        <button class="phone" id="vrefocus">field→field: blur+focus to apply hints</button>
      </div>
      <div id="kbdstate"></div>
      <textarea
        id="pastecheck"
        rows="2"
        style="width: 95%; font-size: 16px"
        placeholder="11: after Copy, long-press here and Paste to verify"
      ></textarea>
      <textarea
        id="pastebox"
        rows="1"
        style="width: 95%; font-size: 16px"
        placeholder="Paste fallback: long-press here and Paste; the text goes to the tab's field"
      ></textarea>
    </div>

    <h2>Results</h2>
    <table id="results"></table>
    <h2>Log <button id="clearlog">clear screen</button></h2>
    <div id="log"></div>

    <script>
      const TOKEN = "__TOKEN__";
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const withToken = (path) =>
        `${path}${path.includes("?") ? "&" : "?"}t=${encodeURIComponent(TOKEN)}`;
      const redact = (text) => String(text).replace(/jwt=[^&"'\s\\]+/g, "jwt=<redacted>");
      const isTouch =
        navigator.maxTouchPoints > 0 &&
        (matchMedia("(pointer: coarse)").matches ||
          /iPhone|iPad|Android/.test(navigator.userAgent));
      const ENV = {
        ua: navigator.userAgent,
        standalone:
          navigator.standalone === true || matchMedia("(display-mode: standalone)").matches,
        origin: location.origin,
        touch: navigator.maxTouchPoints,
        coarse: matchMedia("(pointer: coarse)").matches,
        dpr: devicePixelRatio,
        inner: `${innerWidth}x${innerHeight}`,
      };
      const device = ENV.standalone ? "pwa" : isTouch ? "phone" : "desktop";
      $("env").textContent = `${device} · ${ENV.ua}`;

      // ---- log: on screen and to /api/log ------------------------------------------------------
      let outbox = [];
      const logEl = $("log");
      function log(src, msg) {
        const text = redact(typeof msg === "string" ? msg : JSON.stringify(msg));
        const entry = { ts: Date.now(), src: `${device}:${src}`, msg: text };
        outbox.push(entry);
        const line = document.createElement("div");
        line.textContent = `${new Date(entry.ts).toISOString().slice(11, 23)} ${entry.src} ${text.slice(0, 600)}`;
        logEl.prepend(line);
        while (logEl.childNodes.length > 400) logEl.lastChild.remove();
      }
      async function flush() {
        if (outbox.length === 0) return;
        const entries = outbox;
        outbox = [];
        try {
          const response = await fetch(withToken("/api/log"), {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ entries }),
            keepalive: entries.length < 50,
          });
          if (!response.ok) throw new Error(String(response.status));
        } catch {
          outbox = entries.concat(outbox);
        }
      }
      setInterval(flush, 1000);
      $("clearlog").onclick = () => (logEl.textContent = "");
      log("env", ENV);

      async function api(path, body) {
        const init =
          body === undefined
            ? {}
            : {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(body),
              };
        const response = await fetch(withToken(`/api/${path}`), init);
        const value = await response.json();
        if (!response.ok) throw new Error(value.error ?? String(response.status));
        return value;
      }

      // ---- results ------------------------------------------------------------------------------
      const rows = new Map();
      function result(name, status, summary, data) {
        let row = rows.get(name);
        if (row === undefined) {
          row = document.createElement("tr");
          row.innerHTML = "<td></td><td></td><td></td>";
          $("results").append(row);
          rows.set(name, row);
        }
        row.cells[0].textContent = name;
        row.cells[1].textContent = status;
        row.cells[1].className = status;
        row.cells[2].textContent = summary;
        if (status !== "running")
          log(
            "RESULT",
            `${name} [${status}] ${summary}${data === undefined ? "" : ` ${JSON.stringify(data)}`}`,
          );
      }

      // ---- CDP over a Live View link ---------------------------------------------------------------
      let frameLogEvery = 50;
      class Cdp {
        constructor(label, wss) {
          this.label = label;
          this.wss = wss;
          this.nextId = 1;
          this.pending = new Map();
          this.listeners = new Map();
          this.closed = null;
          this.frames = 0;
        }
        open(timeoutMs = 15000) {
          return new Promise((resolve, reject) => {
            const started = performance.now();
            let ws;
            try {
              ws = new WebSocket(`wss://${this.wss}`);
            } catch (error) {
              reject(error);
              return;
            }
            this.ws = ws;
            const timer = setTimeout(() => {
              log(this.label, "open timed out");
              reject(new Error("open timed out"));
              ws.close();
            }, timeoutMs);
            ws.onopen = () => {
              clearTimeout(timer);
              this.openedAt = Date.now();
              log(
                this.label,
                `open (${Math.round(performance.now() - started)} ms) protocol="${ws.protocol}" extensions="${ws.extensions}"`,
              );
              resolve(this);
            };
            ws.onerror = () => log(this.label, "error event");
            ws.onclose = (event) => {
              clearTimeout(timer);
              this.closed = {
                code: event.code,
                reason: event.reason,
                wasClean: event.wasClean,
                at: Date.now(),
              };
              log(
                this.label,
                `close code=${event.code} reason="${event.reason}" clean=${event.wasClean}${this.openedAt ? ` after ${Date.now() - this.openedAt} ms open` : " (never opened)"}`,
              );
              for (const [, pending] of this.pending)
                pending.reject(new Error(`socket closed (${event.code})`));
              this.pending.clear();
              reject(new Error(`closed before open (code ${event.code})`));
              this.emit("__close", this.closed);
            };
            ws.onmessage = (event) => {
              const message = JSON.parse(event.data);
              if (message.method === "Page.screencastFrame") {
                this.frames++;
                if (this.frames <= 3 || this.frames % frameLogEvery === 0) {
                  const { data, ...rest } = message.params;
                  log(
                    this.label,
                    `recv Page.screencastFrame #${this.frames} ${JSON.stringify({ ...rest, bytes: data.length })}`,
                  );
                }
              } else {
                log(this.label, `recv ${event.data.slice(0, 3000)}`);
              }
              if (message.id !== undefined) {
                const pending = this.pending.get(message.id);
                if (pending === undefined) return;
                this.pending.delete(message.id);
                if (message.error)
                  pending.reject(new Error(`${pending.method}: ${JSON.stringify(message.error)}`));
                else pending.resolve(message.result);
              } else {
                this.emit(message.method, message.params);
              }
            };
          });
        }
        get alive() {
          return this.ws !== undefined && this.ws.readyState === WebSocket.OPEN;
        }
        send(method, params = {}, timeoutMs = 15000, quiet = false) {
          if (!this.alive)
            return Promise.reject(
              new Error(`${method}: socket not open (readyState ${this.ws?.readyState})`),
            );
          const id = this.nextId++;
          const payload = JSON.stringify({ id, method, params });
          if (!quiet) log(this.label, `send ${payload.slice(0, 1500)}`);
          this.ws.send(payload);
          return new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              this.pending.delete(id);
              reject(new Error(`${method}: no answer in ${timeoutMs} ms`));
            }, timeoutMs);
            this.pending.set(id, {
              method,
              resolve: (value) => {
                clearTimeout(timer);
                resolve(value);
              },
              reject: (error) => {
                clearTimeout(timer);
                reject(error);
              },
            });
          });
        }
        on(method, listener) {
          const set = this.listeners.get(method) ?? new Set();
          set.add(listener);
          this.listeners.set(method, set);
          return () => set.delete(listener);
        }
        once(method, timeoutMs) {
          return new Promise((resolve, reject) => {
            const off = this.on(method, (params) => {
              off();
              clearTimeout(timer);
              resolve(params);
            });
            const timer = setTimeout(() => {
              off();
              reject(new Error(`no ${method} in ${timeoutMs} ms`));
            }, timeoutMs);
          });
        }
        emit(method, params) {
          for (const listener of this.listeners.get(method) ?? []) listener(params);
        }
        close() {
          this.ws?.close(1000, "harness close");
        }
        async closedNow(timeoutMs = 5000) {
          if (this.closed) return this.closed;
          this.close();
          const deadline = Date.now() + timeoutMs;
          while (!this.closed && Date.now() < deadline) await sleep(50);
          return this.closed;
        }
      }

      let info;
      async function ensureSetup(fresh = false) {
        if (info !== undefined && !fresh) return info;
        info = await api("setup", { fresh });
        $("info").textContent =
          `browser ${info.sessionId} · tab ${info.tabTargetId} · other ${info.otherTargetId}`;
        log("setup", info);
        return info;
      }
      $("setup").onclick = () =>
        ((info = undefined), ensureSetup(false)).catch((error) => log("setup", `ERROR ${error}`));
      $("fresh").onclick = () => ensureSetup(true).catch((error) => log("setup", `ERROR ${error}`));

      async function mint(options = {}) {
        await ensureSetup();
        const minted = await api("mint", options);
        log(
          "mint",
          `${JSON.stringify(options)} -> keys ${minted.replyKeys} wss ${redact(minted.wss)}`,
        );
        return minted;
      }
      async function connect(label, options = {}) {
        const { wss } = await mint(options);
        const cdp = new Cdp(label, wss);
        await cdp.open();
        return cdp;
      }
      async function evalIn(cdp, expression) {
        const reply = await cdp.send("Runtime.evaluate", {
          expression,
          returnByValue: true,
          awaitPromise: true,
        });
        if (reply.exceptionDetails)
          throw new Error(`evaluate: ${JSON.stringify(reply.exceptionDetails).slice(0, 300)}`);
        return reply.result.value;
      }
      async function agentEval(expression, target) {
        await ensureSetup();
        const { result: reply } = await api("cdp", {
          method: "Runtime.evaluate",
          params: { expression, returnByValue: true, awaitPromise: true },
          target: target ?? info.tabTargetId,
        });
        return reply.result.value;
      }
      const METRICS = `({ w: innerWidth, h: innerHeight, dpr: devicePixelRatio, ow: outerWidth, oh: outerHeight, sw: screen.width, sh: screen.height, vv: window.visualViewport ? [visualViewport.width, visualViewport.height, visualViewport.scale] : null, touchPoints: navigator.maxTouchPoints, coarse: matchMedia("(pointer: coarse)").matches, ontouchstart: "ontouchstart" in window, mobileUA: /Mobile/.test(navigator.userAgent) })`;
      const short = (m) => (m ? `${m.w}x${m.h}@${m.dpr}` : String(m));

      // Start a screencast and wait for its first frame. A background tab sends none
      // (Page.screencastVisibilityChanged {visible: false}): then bring it to the front and wait again.
      async function screencast(cdp, params, r) {
        const visibility = [];
        cdp.on("Page.screencastVisibilityChanged", (p) => visibility.push(p.visible));
        let first = cdp.once("Page.screencastFrame", 3000);
        await cdp.send("Page.startScreencast", params);
        try {
          const frame = await first;
          r.screencastStart = { frameWithoutBringToFront: true, visibility };
          return frame;
        } catch {
          r.screencastStart = {
            frameWithoutBringToFront: false,
            visibilityEvents: [...visibility],
            visibilityState: await evalIn(
              cdp,
              "document.visibilityState + '/' + document.hasFocus()",
            ),
          };
          first = cdp.once("Page.screencastFrame", 10000);
          await cdp.send("Page.bringToFront");
          const frame = await first;
          r.screencastStart.afterBringToFront = {
            frame: true,
            visibilityEvents: [...visibility],
            visibilityState: await evalIn(
              cdp,
              "document.visibilityState + '/' + document.hasFocus()",
            ),
          };
          return frame;
        }
      }

      async function centerOf(cdp, selector) {
        return evalIn(
          cdp,
          `(() => { const el = document.querySelector(${JSON.stringify(selector)}); el.scrollIntoView({ block: "center" }); const r = el.getBoundingClientRect(); return { x: Math.round(r.left + Math.min(r.width / 2, 40)), y: Math.round(r.top + r.height / 2) }; })()`,
        );
      }
      async function tap(cdp, { x, y }) {
        await cdp.send("Input.dispatchTouchEvent", {
          type: "touchStart",
          touchPoints: [{ x, y, id: 1 }],
        });
        await sleep(60);
        await cdp.send("Input.dispatchTouchEvent", { type: "touchEnd", touchPoints: [] });
      }
      async function click(cdp, { x, y }) {
        await cdp.send("Input.dispatchMouseEvent", { type: "mouseMoved", x, y, button: "none" });
        await cdp.send("Input.dispatchMouseEvent", {
          type: "mousePressed",
          x,
          y,
          button: "left",
          clickCount: 1,
        });
        await cdp.send("Input.dispatchMouseEvent", {
          type: "mouseReleased",
          x,
          y,
          button: "left",
          clickCount: 1,
        });
      }
      async function key(cdp, { key, code, keyCode, text }) {
        await cdp.send("Input.dispatchKeyEvent", {
          type: text ? "keyDown" : "rawKeyDown",
          key,
          code,
          windowsVirtualKeyCode: keyCode,
          nativeVirtualKeyCode: keyCode,
          ...(text ? { text, unmodifiedText: text } : {}),
        });
        await cdp.send("Input.dispatchKeyEvent", {
          type: "keyUp",
          key,
          code,
          windowsVirtualKeyCode: keyCode,
          nativeVirtualKeyCode: keyCode,
        });
      }
      async function step(results, name, fn) {
        try {
          results[name] = await fn();
        } catch (error) {
          results[name] = `ERROR ${error.message}`;
        }
        log("step", `${name}: ${JSON.stringify(results[name])}`);
        return results[name];
      }

      // ---- checks -------------------------------------------------------------------------------
      const checks = {};

      checks[1] = async () => {
        const cdp = await connect("c1");
        const session = await cdp.send("Cloudflare.getSessionId");
        const href = await evalIn(cdp, "location.href");
        await cdp.closedNow();
        return [
          "pass",
          `connected from ${location.origin} (${device}${ENV.standalone ? ", standalone" : ""}); getSessionId answered; tab is ${href}`,
          { session, env: ENV },
        ];
      };

      checks[2] = async () => {
        await ensureSetup();
        const r = {};
        const where = async (label, wss) => {
          const cdp = new Cdp(label, wss);
          try {
            await cdp.open();
          } catch (error) {
            return `refused: ${error.message}`;
          }
          try {
            return `connected to ${await evalIn(cdp, "location.search")}`;
          } catch (error) {
            return `open, but ${error.message}`;
          } finally {
            await cdp.closedNow();
          }
        };
        const tabLink = await mint();
        r.tabLinkPathHasTab = tabLink.wss.includes(`/page/${info.tabTargetId}`);
        r.unchanged = await where("c2-tab", tabLink.wss);
        r.swappedToOther = await where(
          "c2-swap",
          tabLink.wss.replace(`/page/${info.tabTargetId}`, `/page/${info.otherTargetId}`),
        );
        r.swappedToBogus = await where(
          "c2-bogus",
          tabLink.wss.replace(
            `/page/${info.tabTargetId}`,
            "/page/0123456789ABCDEF0123456789ABCDEF",
          ),
        );
        const otherViaTab = await mint({ targetId: info.otherTargetId });
        r.mintOtherViaTabSessionPathHasOther = otherViaTab.wss.includes(
          `/page/${info.otherTargetId}`,
        );
        r.mintOtherViaTabSession = await where("c2-other-tab", otherViaTab.wss);
        const otherViaBrowser = await mint({ targetId: info.otherTargetId, via: "browser" });
        r.mintOtherViaBrowserPathHasOther = otherViaBrowser.wss.includes(
          `/page/${info.otherTargetId}`,
        );
        r.mintOtherViaBrowser = await where("c2-other-browser", otherViaBrowser.wss);
        const bound = !r.swappedToOther.includes("which=other");
        return [
          bound ? "pass" : "info",
          bound
            ? "the target in the path is bound to the link"
            : "swapping the target id in the path reaches the other page",
          r,
        ];
      };

      checks[3] = async (waitMs = 65000) => {
        const { wss } = await mint();
        const minted = Date.now();
        const a = new Cdp("c3a", wss);
        await a.open();
        const r = {};
        const b = new Cdp("c3b", wss);
        try {
          await b.open();
          r.secondWithin60s = `accepted, eval=${await evalIn(b, "1+1")}`;
        } catch (error) {
          r.secondWithin60s = `refused: ${error.message}`;
        }
        await b.closedNow();
        while (Date.now() - minted < waitMs) {
          result(
            "3 expiry",
            "running",
            `waiting ${Math.round((waitMs - (Date.now() - minted)) / 1000)} s`,
          );
          await sleep(1000);
        }
        r.openAfterExpiry = await evalIn(a, "1+1").then(
          (value) =>
            `answers (${value}) ${Math.round((Date.now() - a.openedAt) / 1000)} s after open`,
          (error) => `dead: ${error.message}`,
        );
        const c = new Cdp("c3c", wss);
        try {
          await c.open();
          r.newAfterExpiry = `accepted, eval=${await evalIn(c, "1+1")}`;
        } catch (error) {
          r.newAfterExpiry = `refused: ${error.message}`;
        }
        await c.closedNow();
        await a.closedNow();
        const ok =
          r.openAfterExpiry.startsWith("answers") && r.newAfterExpiry.startsWith("refused");
        return [
          ok ? "pass" : "fail",
          `open conn: ${r.openAfterExpiry}; new conn after ${Math.round(waitMs / 1000)} s: ${r.newAfterExpiry}; 2nd conn in window: ${r.secondWithin60s}`,

      const bg = { periods: [] };
      function renderBg() {
        const head = `away(s)  on return       closed(s after leaving)  ping on return   reconnect\n`;
        $("bgtable").textContent =
          `9: socket ${bg.cdp?.alive ? "OPEN" : "closed"} · ${bg.pings ?? 0} pings ok, ${bg.pingFails ?? 0} failed\n` +
          head +
          bg.periods
            .map(
              (p) =>
                `${String(p.away).padEnd(9)}${p.state.padEnd(15)}${String(p.closedAfter ?? "-").padEnd(25)}${p.ping.padEnd(17)}${p.reconnect ?? "-"}`,
            )
            .join("\n");
      }
      async function bgConnect() {
        bg.cdp = await connect("c9");
        bg.cdp.on("__close", () => renderBg());
        renderBg();
      }
      $("bgstart").onclick = async () => {
        try {
          await bgConnect();
          bg.pings = 0;
          bg.pingFails = 0;
          clearInterval(bg.timer);
          // Like the hosted page: a Cloudflare.getSessionId every 5 s.
          bg.timer = setInterval(async () => {
            if (document.visibilityState !== "visible" || !bg.cdp?.alive) return;
            try {
              await bg.cdp.send("Cloudflare.getSessionId", {}, 4000, true);
              bg.pings++;
            } catch {
              bg.pingFails++;
            }
            renderBg();
          }, 5000);
          result(
            "9 background",
            "running",
            "connected: switch to another app, come back, repeat (10 s, 30 s, 2 min)",
          );
        } catch (error) {
          result("9 background", "fail", `could not connect: ${error.message}`);
        }
      };
      // A socket can still say OPEN after iOS suspended the page: ping it with a short timeout, and on no answer
      // drop it and connect again with a fresh link.
      const RETURN_PING_MS = 1500;
      const alive = (cdp) =>
        cdp?.alive
          ? cdp.send("Cloudflare.getSessionId", {}, RETURN_PING_MS).then(
              () => "answered",
              (error) => `no: ${error.message.slice(0, 40)}`,
            )
          : Promise.resolve(`no: socket ${cdp?.closed ? `closed ${cdp.closed.code}` : "missing"}`);
      let returning;
      async function onReturn(trigger) {
        if (document.visibilityState !== "visible" || returning) return;
        returning = (async () => {
          log("page", `back (${trigger})`);
          if (bg.cdp !== undefined && bg.hiddenAt !== undefined) {
            const period = {
              away: Math.round((Date.now() - bg.hiddenAt) / 1000),
              state: bg.cdp.alive ? "open" : `closed ${bg.cdp.closed?.code ?? ""}`,
            };
            if (bg.cdp.closed) {
              period.closedAfter = Math.round((bg.cdp.closed.at - bg.hiddenAt) / 1000);
            }
            period.ping = await alive(bg.cdp);
            if (period.ping !== "answered") {
              const started = Date.now();
              try {
                bg.cdp.close();
                await bgConnect();
                period.reconnect = `new link ok in ${Date.now() - started} ms`;
              } catch (error) {
                period.reconnect = `failed: ${error.message}`;
              }
            }
            log("c9", `return via ${trigger}: ${JSON.stringify(period)}`);
            bg.hiddenAt = undefined;
            bg.periods.push(period);
            result(
              "9 background",
              "info",
              bg.periods

            `Paste via ${path}: ${text.length} chars into the target (${focus.focused} focused)`,
          );
          result("edit menu Paste", "info", `${path}: ${JSON.stringify(text.slice(0, 80))}`);
        });
      }
      function pasteFallback(why) {
        log("menu", `Paste: ${why}; showing the paste box`);
        result("edit menu Paste", "info", `${why} -> paste box`);
        const box = $("pastebox");
        box.value = "";
        box.scrollIntoView({ block: "center" });
        box.focus({ preventScroll: true });
        box.style.outline = "3px solid #f38020";
      }
      $("pastebox").addEventListener("input", () => {
        const box = $("pastebox");
        const text = box.value;
        if (!text || !view.cdp?.alive) return;
        box.value = "";
        box.style.outline = "";
        box.blur();
        insertIntoTab(text, "paste box").catch((error) =>
          log("menu", `paste box: ${error.message}`),
        );
      });
      function runMenuAction(action) {
        const current = view.menu;
        if (current === undefined || !view.cdp?.alive) return;
        const { info, point } = current;
        log("menu", `${action} tapped (keyboard textarea focused=${kbdFocused()})`);
        if (action === "Copy") {
          copyToClipboard(readSelection(info, point), "Copy").catch(() => {});
          hideMenu("copied");
        } else if (action === "Cut") {
          const text = readSelection(info, point);
          copyToClipboard(text, "Cut").catch(() => {});
          text.then(() => {
            pressKey("Backspace", "Backspace", 8);
            resetInputSentinel("cut");
            scheduleRefresh("cut");
          });
          hideMenu("cut");
        } else if (action === "Paste") {
          hideMenu("paste");
          if (!navigator.clipboard?.readText) {
            pasteFallback("no clipboard.readText");
            return;
          }
          navigator.clipboard.readText().then(
            (text) =>
              text
                ? insertIntoTab(text, "clipboard.readText").catch((error) =>
                    log("menu", `Paste: ${error.message}`),
                  )
                : log("menu", "Paste: the clipboard is empty"),
            (error) => pasteFallback(`clipboard.readText rejected: ${error.name} ${error.message}`),
          );
        } else if (action === "Select All") {
          evalIn(view.cdp, EDIT_SELECT_ALL).then(
            (reply) => {
              log("menu", `Select All: ${JSON.stringify(reply)}`);
              resetInputSentinel("select all");
              showMenuAt(point, "select all", { caret: true });
            },
            (error) => log("menu", `Select All failed: ${error.message}`),
          );
        }
      }
      // Touching the menu must not move focus (the keyboard stays as it was) or reach the frame; an item acts on
      // pointerup, which for a touch is inside the gesture iOS needs for the clipboard.
      menu.addEventListener("touchstart", (event) => event.preventDefault(), { passive: false });
      menu.addEventListener("mousedown", (event) => event.preventDefault());
      menu.addEventListener("contextmenu", (event) => event.preventDefault());
      menu.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const button = event.target.closest("button");
        menu.pressed = button ?? null;
        button?.classList.add("down");
      });
      menu.addEventListener("pointerup", (event) => {
        event.preventDefault();
        const button = event.target.closest("button");
        const pressed = menu.pressed;
        menu.pressed = null;
        pressed?.classList.remove("down");
        // A touch's pointerup targets where it began: check that it ended on the same item.
        const under = document.elementFromPoint(event.clientX, event.clientY)?.closest("button");
        if (pressed && button === pressed && under === pressed)
          runMenuAction(pressed.dataset.action);
      });
      menu.addEventListener("pointercancel", () => {
        menu.pressed?.classList.remove("down");
        menu.pressed = null;
      });
      // A double tap: the tab selects the word under it as for a mouse double-click, then the menu shows.
      async function doubleTap(point) {
        if (!view.cdp?.alive) return;
        const seq = menuSeq;
        let word;
        try {
          word = await evalIn(view.cdp, `${WORD_AT}(${point.x}, ${point.y})`);
        } catch (error) {
          log("menu", `double tap: probe failed: ${error.message}`);
          return;
        }
        if (seq !== menuSeq) return;
        if (!word.word) {
          log("menu", `double tap at ${point.x},${point.y}: ${word.why} -> no word selection`);
          return;
        }
        const send = (params) =>
          view.cdp.send("Input.dispatchMouseEvent", { ...point, button: "left", ...params });
        await send({ type: "mousePressed", clickCount: 2 });
        await send({ type: "mouseReleased", clickCount: 2 });
        log("menu", `double tap at ${point.x},${point.y}: ${word.why} -> mouse double press`);
        await sleep(120);
        if (seq === menuSeq) showMenuAt(point, "double tap");
      }
      // ---- typing through the hidden textarea ---------------------------------------------------
      // Ported from Kernel's live view (kernel-images, commit 2c3fabc9a04a9f445870f183e21e3475104cb8cc,
      // https://github.com/kernel/kernel-images), licensed under the Apache License, Version 2.0
      // (http://www.apache.org/licenses/LICENSE-2.0): the input sentinel and its reset, and the overlay's input handler
      // (images/chromium-headful/client/src/components/video.vue: INPUT_SENTINEL, resetInputSentinel, onOverlayInput,
      // onCompositionEnd), TypedText (utils/typed-text.ts) and textDiff (utils/text-input.ts). Changed here: plain
      // functions instead of classes, CDP Input.insertText and key events instead of X keysyms, the same diff path
      // whether or not text is kept, and line breaks sent as Enter.
      //
      // The textarea always holds a sentinel character before the caret, so iOS has something to delete and sends
      // Backspace (an empty field gets nothing). Where autocorrect is on, the text typed since the last reset is kept
      // after the sentinel so the keyboard can correct it; each change is diffed against what was sent and goes to the
      // tab as Backspaces and text. Deleting the sentinel is one Backspace past the kept text, and starts over.
      const INPUT_SENTINEL = " ";
      const MAX_TEXT = 1000;
      const typed = { text: "", keep: false, composing: false };
      function textDiff(previous, next) {
        const a = Array.from(previous);
        const b = Array.from(next);
        let common = 0;
        while (common < a.length && common < b.length && a[common] === b[common]) common++;
        return { deletes: a.length - common, insert: b.slice(common).join("") };
      }
      function resetInputSentinel(why) {
        typed.text = "";
        kbd.value = INPUT_SENTINEL;
        kbd.setSelectionRange(INPUT_SENTINEL.length, INPUT_SENTINEL.length);
        if (why) log("kbd", `sentinel reset (${why})`);
      }
      // A key press on the tab, both events sent at once so they keep their order with the text around them.
      function pressKey(name, code, keyCode, text) {
        if (!view.cdp?.alive) return;
        const base = {
          key: name,
          code,
          windowsVirtualKeyCode: keyCode,
          nativeVirtualKeyCode: keyCode,
        };
        view.cdp
          .send(
            "Input.dispatchKeyEvent",
            {
              type: text ? "keyDown" : "rawKeyDown",
              ...base,
              ...(text ? { text, unmodifiedText: text } : {}),
            },
            5000,
            true,
          )
          .catch(() => {});
        view.cdp
          .send("Input.dispatchKeyEvent", { type: "keyUp", ...base }, 5000, true)
          .catch(() => {});
      }
      function sendText(text) {
        const lines = text.split(/\r\n|\r|\n/);
        lines.forEach((line, index) => {
          if (index > 0) pressKey("Enter", "Enter", 13, "\r");
          if (line) view.cdp?.send("Input.insertText", { text: line }, 5000, true).catch(() => {});
        });
      }
      // The textarea's value after an edit; false when it should be reset (its sentinel went, or it holds too much).
      function editTyped(value) {
        const kept = value.startsWith(INPUT_SENTINEL);
        const next = kept ? value.slice(INPUT_SENTINEL.length) : value;
        const { deletes, insert } = textDiff(typed.text, next);
        const backspaces = deletes + (kept ? 0 : 1);
        for (let i = 0; i < backspaces; i++) pressKey("Backspace", "Backspace", 8);
        if (insert) sendText(insert);
        if (backspaces || insert) {
          log(
            "kbd",
            `edit: ${backspaces} Backspace + ${JSON.stringify(insert)} (kept ${JSON.stringify(next)}${kept ? "" : ", sentinel deleted"})`,
          );
        }
        typed.text = next;
        return kept && next.length <= MAX_TEXT;
      }
      kbd.addEventListener("beforeinput", (event) => {
        log(
          "kbd",
          `beforeinput ${event.inputType} data=${JSON.stringify(event.data)} value=${JSON.stringify(kbd.value)}`,
        );
      });
      kbd.addEventListener("input", (event) => {
        if (!view.cdp?.alive) return;
        hideMenu("typing");
        scheduleRefresh("input");
        const kept = editTyped(kbd.value);
        if ((!typed.keep || !kept) && !typed.composing) resetInputSentinel();
      });
      kbd.addEventListener("compositionstart", () => {
        typed.composing = true;
        log("kbd", "compositionstart");
      });
      kbd.addEventListener("compositionend", (event) => {
        typed.composing = false;
        log("kbd", `compositionend ${JSON.stringify(event.data)}`);
        // The composition's input events already sent its text; this catches one whose last input came after.
        const kept = editTyped(kbd.value);
        if (!typed.keep || !kept) resetInputSentinel();
      });
      kbd.addEventListener("paste", (event) => {
        event.preventDefault();
        const text = event.clipboardData?.getData("text/plain") ?? "";
        log("kbd", `paste ${text.length} chars`);
        if (text) sendText(text.replace(/[\r\n]+$/, ""));
        resetInputSentinel();
      });
      kbd.addEventListener("keydown", (event) => {
        const keys = {
          ArrowLeft: 37,
          ArrowUp: 38,
          ArrowRight: 39,
          ArrowDown: 40,
          Tab: 9,
          Escape: 27,
        };
        if (keys[event.key] !== undefined) {
          event.preventDefault();
          pressKey(event.key, event.key, keys[event.key]);
          // The tab's caret moved: autocorrect must not reach back past it.
          resetInputSentinel();
        }
      });
      const SELECTION = `(() => { const el = document.activeElement; if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA") && typeof el.selectionStart === "number") return el.value.slice(el.selectionStart, el.selectionEnd); return String(getSelection()); })()`;
      $("vcopy").onclick = () => {
        if (!view.cdp?.alive) return;
        const started = performance.now();
        const text = evalIn(view.cdp, SELECTION).then((value) => {
          log(
            "copy",
            `selection read in ${Math.round(performance.now() - started)} ms: ${JSON.stringify(value)}`,
          );
          view.copied = value;
          return new Blob([value ?? ""], { type: "text/plain" });
        });
        try {
          navigator.clipboard.write([new ClipboardItem({ "text/plain": text })]).then(
            () =>
              result(
                "11 copy",
                "info",
                `clipboard.write resolved after ${Math.round(performance.now() - started)} ms with ${JSON.stringify(view.copied)}; paste into the box below to confirm`,
              ),
            (error) =>
              result("11 copy", "fail", `clipboard.write rejected: ${error.name} ${error.message}`),
          );
        } catch (error) {
          result("11 copy", "fail", `clipboard.write threw: ${error.name} ${error.message}`);
        }
      };
      $("pastecheck").addEventListener("input", () => {
        const pasted = $("pastecheck").value;
        result(
          "11 paste check",
          pasted === view.copied ? "pass" : "info",
          `pasted ${JSON.stringify(pasted)} vs copied ${JSON.stringify(view.copied)}`,
        );
      });
      $("vsel").onclick = async () => {
        if (!view.cdp?.alive) return;
        result("11 tab selection", "info", JSON.stringify(await evalIn(view.cdp, SELECTION)));
      };
      $("vkbd").onclick = () => {
        kbd.focus({ preventScroll: true });
        attention(false);
        kbdState("· forced");
      };
      $("vlp").onclick = () => {
        view.selectMode = !view.selectMode;
        $("vlp").textContent = view.selectMode
          ? "long press: mouse select"
          : "long press: touch events";
      };
      $("vscroll").onclick = () => view.cdp?.alive && evalIn(view.cdp, "scrollTo(0, 0); true");
      // These keep the textarea focused: pointerdown's default (moving focus) is prevented.
      const keepFocus = (id, handler) => {
        $(id).addEventListener("pointerdown", (event) => {
          event.preventDefault();
          handler();
          kbdState();
        });
        $(id).addEventListener("mousedown", (event) => event.preventDefault());
        // iOS moves focus on touch even when pointerdown's default is prevented.
        $(id).addEventListener("touchstart", (event) => event.preventDefault(), { passive: false });
      };
      keepFocus("vblur", () => kbd.blur());
      const cycle = (id, attribute, label, values) => {
        let index = 0;
        keepFocus(id, () => {
          index = (index + 1) % values.length;
          kbd[attribute] = values[index];
          $(id).textContent = `${label}: ${values[index]}`;
          log(
            "kbd",
            `${label} -> ${values[index]} while focused=${document.activeElement === kbd}`,
          );
        });
      };
      cycle("vmode", "inputMode", "inputmode", [
        "text",
        "email",
        "numeric",
        "decimal",
        "tel",
        "url",
        "search",
        "none",
      ]);
      cycle("vhint", "enterKeyHint", "enterkeyhint", [
        "enter",
        "go",
        "send",
        "search",
        "next",
        "done",
      ]);
      cycle("vcap", "autocapitalize", "autocapitalize", [
        "sentences",
        "words",
        "characters",
        "off",
      ]);
    </script>
  </body>
