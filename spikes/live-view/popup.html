<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spike pop-up</title>
  </head>
  <body
    style="
      font:
        16px system-ui,
        sans-serif;
    "
  >
    <h1 id="kind">Pop-up</h1>
    <p id="opener"></p>
    <button
      id="nested-btn"
      style="padding: 10px"
      onclick="window.open('/popup?kind=nested', 'nested', 'popup,width=300,height=400')"
    >
      open a nested pop-up
    </button>
    <script>
      const kind = new URLSearchParams(location.search).get("kind") ?? "?";
      document.getElementById("kind").textContent = `Pop-up (${kind})`;
      document.title = `Spike pop-up (${kind})`;
      document.getElementById("opener").textContent =
        `window.opener: ${window.opener === null ? "null" : "set"}`;
    </script>
  </body>
</html>
