name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `closed` destroys the pull request's preview (the `preview` job).
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  # `bun install` runs `prepare`: skip the git hooks. CI=true (set by Actions)
  # makes it skip the large reference-repo clones but keeps the effect-tsgo patch.
  HUSKY: "0"
  # Turbo's local cache, where the `check` job's cache step saves and restores it. Set, not left to turbo's default, so
  # the two cannot drift apart.
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  # What `bun run check` runs, split over runners so they run at once: the server's tests alone took about 4½ minutes on
  # one runner, sharing its 4 cores with every other task, while the rest was done in about 1½. Each part has its own
  # turbo cache, so a part whose inputs did not change replays its logs.
  checks:
    name: ${{ matrix.name }}
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not workflow-level: a new push cancels the PR's previous check, but never a preview deploy or destroy
    # midway (the `preview` job has its own group). One group per part, or the parts would cancel each other.
    concurrency:
      group: check-${{ matrix.part }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      # Every part reports, so one push shows every failure.
      fail-fast: false
      matrix:
        include:
          # `check` does not build; the web app's bundle is what the server serves, so make sure it still builds.
          - name: Typecheck, lint, format, build
            part: static
            run: >-
              bunx turbo run typecheck lint
              && bun run format:check
              && bunx turbo run build --filter @cloudpid/web
          - name: Tests
            part: tests
            run: bunx turbo run test --filter '!@cloudpid/server'
          # vitest splits the server's test files (all its projects) over the shards; the shard is part of the task's
          # hash, so each shard is cached on its own.
          - name: Server tests (1/3)
            part: server-1
            run: bunx turbo run test --filter @cloudpid/server -- --shard=1/3
          - name: Server tests (2/3)
            part: server-2
            run: bunx turbo run test --filter @cloudpid/server -- --shard=2/3
          - name: Server tests (3/3)
            part: server-3
            run: bunx turbo run test --filter @cloudpid/server -- --shard=3/3
    env:
      # A run summary per turbo run (`.turbo/runs`), naming every task's hash, for the cache pruning below.
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@v7

      # Bun, Node, Bun's packages (cached by lockfile, with a fallback), and the install.
      - uses: ./.github/actions/setup

      # This part's turbo cache: the newest one of this branch, else of main (a pull request can read its base's caches).
      - uses: actions/cache@v6
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ matrix.part }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.part }}-${{ runner.os }}-

      - run: ${{ matrix.run }}

      # Keep only the entries this commit's tasks used or made. Turbo never evicts, and each save carries the restored
      # cache forward, so without this it grows with every commit. Every task of the part runs in every check, so what
      # this run names is all a later run of the part can hit. Only after a passing run: a failed one stops early and
      # names too few, and the cache step saves nothing then anyway.
      - name: Prune turbo cache
        run: |
          hashes=$(jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u)
          before=$(du -sh "$TURBO_CACHE_DIR" | cut -f1)
          for file in "$TURBO_CACHE_DIR"/*; do
            name=$(basename "$file")
            grep -qxF "${name%%[-.]*}" <<<"$hashes" || rm -f "$file"
          done
          echo "Turbo cache: $before → $(du -sh "$TURBO_CACHE_DIR" | cut -f1), $(wc -l <<<"$hashes") tasks kept"

  # The one status the `main` ruleset requires (`Check`), and what the deploy jobs wait for: it passes only when every
  # part did. It runs when one fails too (`!cancelled()`), so a failure reports as one rather than as skipped, which
  # a required check would count as passing.
  check:
    name: Check
    needs: checks
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.checks.result }}

  # Deploys `prod` on push to main with a scoped API token from the `production` environment
  # (credentials as code: infra/github.ts, docs/development/infra.md → CI credentials).
  deploy:
    name: Deploy prod
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://pi.ianpascoe.dev
    # One deploy at a time; never cancel one midway.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # No dependency cache in a job holding deploy credentials (cache poisoning).
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: bun install --frozen-lockfile

      # The deploy credentials are scoped to this step: install scripts never see them.
      - run: bun run deploy --stage prod --no-input --yes
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Bound to the Worker as secrets by the Session DO's `Config.Redacted` reads.
          MODEL_PROXY_URL: ${{ vars.MODEL_PROXY_URL }}
          MODEL_PROXY_API_KEY: ${{ secrets.MODEL_PROXY_API_KEY }}
          # The master key the Session DO encrypts the owner's Secrets under; read the same way, and required.
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          # Search keys, read by the web extension the same way. Both are set in `production`. A secret that is not set
          # reaches the stack as an empty string: `WebConfigLive` treats that as no key, but whether alchemy accepts an
          # empty secret binding is not verified, so set both (or remove the line of one you will never set).
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          # The GitHub App the Workers mint GitHub tokens from (ADR-0025; read by `Config.Redacted`, bound as Worker
          # secrets). Written into `production` and `preview` by `bun run github-app:setup` in `infra`.
          CLOUDPID_GITHUB_APP_ID: ${{ secrets.CLOUDPID_GITHUB_APP_ID }}
          CLOUDPID_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLOUDPID_GITHUB_APP_PRIVATE_KEY }}
          # The read-only analytics token the Workspace DO reads its Containers' usage with (optional; bound as a Worker
          # secret). Written into `production` and `preview` by infra/github.ts, not by hand.
          CLOUDPID_ANALYTICS_TOKEN: ${{ secrets.CLOUDPID_ANALYTICS_TOKEN }}
          # The VAPID identity Web Push messages are signed with (read by the Registry DO's `Config.Redacted`, bound as
          # Worker secrets): the public key also goes to the web app, which subscribes with it. Set in `production`.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

  # Deploys stage `pr-<number>` for a pull request from this repository, and destroys it when the pull request is closed
  # (https://alchemy.run/environments/ci/#how-pr-previews-work). Credentials come from the `preview` environment, which
  # any branch may use (infra/github.ts): its own token, without the zone permissions only `prod` needs, and its own copy
  # of the app secrets. Pull requests from forks get no secrets, so they get no preview.
  preview:
    name: Preview
    needs: check
    # `check` is skipped on `closed`, so the destroy runs without it; a deploy waits for it to pass.
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # The preview comment (GitHub.Comment in infra/alchemy.run.ts).
      pull-requests: write
    environment:
      name: preview
    # One deploy or destroy per pull request at a time, never cancelled midway: a newer push waits, and a close waits
    # for the running deploy, then destroys what it made. A deploy that only starts after the close (it waited for
    # `check`, the destroy did not) deploys nothing: see the first step.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # A push's deploy waits for `check` (minutes) but a close's destroy does not, so a pull request closed while its
      # last push is still being checked is destroyed first, when the stage is empty ("Plan: no resources"), and then
      # deployed by that push: a stage nothing destroys, left on the account (#328). The job holds the concurrency
      # group here, so a close that arrives after this check waits for the deploy and destroys it. The event's own
      # `pull_request.state` is the state at the push, so ask GitHub now.
      - name: Check the pull request is still open
        id: pull-request
        if: github.event.action != 'closed'
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != open ]; then echo "::notice::Pull request $PULL_REQUEST is $state: not deploying its preview."; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

      # A destroy evaluates the stack too: check out the commit that was last deployed, since the merge ref of a closed
      # pull request may be gone.
      - uses: actions/checkout@v7
        if: steps.pull-request.outputs.state != 'closed'
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      # Bun's packages are only read here, never written: this job holds deploy credentials. Reading them adds no trust a
      # preview did not already need: a pull request can read only its own caches (written by its `check` job, from the
      # code this job deploys) and main's. Bun trusts its cache, so a poisoned one is the risk: only `check` jobs of
      # this repository write it.
      - uses: ./.github/actions/setup
        if: steps.pull-request.outputs.state != 'closed'
        with:
          save-cache: "false"

      # The deploy credentials are scoped to this step: install scripts never see them. `destroy` evaluates the stack,
      # so it needs every variable `deploy` does (see the `deploy` job for what each is).
      - name: ${{ github.event.action == 'closed' && 'Destroy' || 'Deploy' }} pr-${{ github.event.pull_request.number }}
        if: steps.pull-request.outputs.state != 'closed'
        working-directory: infra
        run: >-
          bunx alchemy
          ${{ github.event.action == 'closed' && 'destroy' || 'deploy' }}
          --stage pr-${{ github.event.pull_request.number }} --no-input --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MODEL_PROXY_URL: ${{ vars.MODEL_PROXY_URL }}
          MODEL_PROXY_API_KEY: ${{ secrets.MODEL_PROXY_API_KEY }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          CLOUDPID_GITHUB_APP_ID: ${{ secrets.CLOUDPID_GITHUB_APP_ID }}
          CLOUDPID_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLOUDPID_GITHUB_APP_PRIVATE_KEY }}
          CLOUDPID_ANALYTICS_TOKEN: ${{ secrets.CLOUDPID_ANALYTICS_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # Read by GitHub.GitHubEnv and GitHub.Comment (infra/alchemy.run.ts): the PR to comment on, and the token to
          # comment with.
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `alchemy destroy` passes when the state it reads is empty, whatever is left on the account, so check the account
      # itself: the stage's Container application (Cloudflare keeps it, with no instances, after its Worker is gone)
      # must be gone, or the job fails. Matches `cloudpid-*-pr-<number>` exactly, never another stage's or project's.
      - name: Check pr-${{ github.event.pull_request.number }} left no Container application
        if: github.event.action == 'closed'
        run: |
          apps=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications")
          jq -e '.success == true and (.result | type == "array")' <<<"$apps" >/dev/null \
            || { echo "::error::Cloudflare did not list the Container applications: $apps"; exit 1; }
          left=$(jq -r --arg stage "pr-$PULL_REQUEST" \
            '.result[] | select(.name | test("^cloudpid-.*-" + $stage + "(-[a-z0-9]+)?$")) | "\(.name) (\(.id))"' \
            <<<"$apps")
          if [ -n "$left" ]; then
            echo "::error::Stage pr-$PULL_REQUEST left Container applications on the account:"
            echo "$left"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
