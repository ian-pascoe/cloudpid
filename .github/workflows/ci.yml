name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `closed` destroys the pull request's preview (the `preview` job).
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  # `bun install` runs `prepare`: skip the git hooks. CI=true (set by Actions)
  # makes it skip the large reference-repo clones but keeps the effect-tsgo patch.
  HUSKY: "0"
  # Turbo's local cache, where the `check` job's cache step saves and restores it. Set, not left to turbo's default, so
  # the two cannot drift apart.
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  # Whether the change touches more than docs (`docs/**` and Markdown anywhere, which no build, test or deploy reads:
  # turbo.json leaves `*.md` out of every task's inputs). A docs-only change runs only the format check (`docs`), not
  # `checks`, the prod deploy or a preview. When the files cannot be listed, the change counts as code.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      preview: ${{ steps.preview.outputs.deployed }}
    steps:
      # A pull request's files are its diff from the merge base (the API lists at most 3,000); a push's, the compare of
      # `before` and the pushed commit (at most 300). A list at its cap may be incomplete, so it counts as code. Renames
      # count their old path too: moving code into docs/ changes the code.
      - name: List the changed files
        id: files
        if: github.event.action != 'closed'
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)') || files=unlisted
            cap=3000
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            files=unlisted
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
              --jq '.files[] | .filename, (.previous_filename // empty)') || files=unlisted
            cap=300
          fi
          count=$(grep -c . <<<"$files" || true)
          if [ "$files" = unlisted ] || [ "$count" -ge "$cap" ]; then
            code=true
          elif grep -qvE '^docs/|\.md$' <<<"$files"; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$count changed files; code: $code"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}

      # On close, destroy the preview only if one was ever started: every run of the `preview` job records a deployment
      # in the `preview` environment, under the branch's name, before its first step. A push whose `preview` job starts
      # after this lookup finds the pull request closed and deploys nothing (see `preview`). When the lookup fails, destroy.
      - name: Look up the preview
        id: preview
        if: github.event.action == 'closed'
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=preview&per_page=1" \
            -f ref="$HEAD_REF" -X GET --jq length) || count=1
          echo "deployed=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}

  # The whole check of a docs-only change: the formatter covers Markdown. oxfmt at the lockfile's version, without the
  # install the other checks need.
  docs:
    name: Format
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: |
          version=$(sed -nE 's/^    "oxfmt": \["oxfmt@([^"]+)".*/\1/p' bun.lock)
          bunx "oxfmt@$version" --check

  # A pull request may only append to a migration manifest (`migrations.manifest.ts`): a plain `git revert` of the change
  # that added a migration removes its line too, which would let the next migration reuse its number (`docs/development/
  # workers.md` → Deploys and Durable Object code updates → Reverts). Needs only the base commit, not the history.
  manifests:
    name: Migration manifests
    needs: changes
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          scripts/check-migration-manifests.sh "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # What `bun run check` runs, split over runners so they run at once: the server's tests alone took about 4½ minutes on
  # one runner, sharing its 4 cores with every other task, while the rest was done in about 1½. Each part has its own
  # turbo cache, so a part whose inputs did not change replays its logs.
  checks:
    name: ${{ matrix.name }}
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not workflow-level: a new push cancels the PR's previous check, but never a preview deploy or destroy
    # midway (the `preview` job has its own group). One group per part, or the parts would cancel each other.
    concurrency:
      group: check-${{ matrix.part }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      # Every part reports, so one push shows every failure.
      fail-fast: false
      matrix:
        include:
          # `check` does not build; the web app's bundle is what the server serves, and `/cloudpid`'s bundle (which also
          # fails when it reaches Workers code) is what the `pi-cloudpid` job publishes: make sure both still build. The
          # Server Worker's startup budget fails here what the deploy would refuse with `ScriptStartupError`
          # (`docs/development/workers.md` → Startup).
          - name: Typecheck, lint, format, build
            part: static
            run: >-
              bunx turbo run typecheck lint
              && bun run format:check
              && bunx turbo run build --filter @cloudpid/web --filter @cloudpid/pi-cloudpid
              && bun run --cwd apps/server startup
          - name: Tests
            part: tests
            run: bunx turbo run test --filter '!@cloudpid/server'
          # vitest splits the server's test files (all its projects) over the shards; the shard is part of the task's
          # hash, so each shard is cached on its own.
          - name: Server tests (1/3)
            part: server-1
            run: bunx turbo run test --filter @cloudpid/server -- --shard=1/3
          - name: Server tests (2/3)
            part: server-2
            run: bunx turbo run test --filter @cloudpid/server -- --shard=2/3
          - name: Server tests (3/3)
            part: server-3
            run: bunx turbo run test --filter @cloudpid/server -- --shard=3/3
    env:
      # A run summary per turbo run (`.turbo/runs`), naming every task's hash, for the cache pruning below.
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@v7

      # Bun, Node, Bun's packages (cached by lockfile, with a fallback), and the install.
      - uses: ./.github/actions/setup

      # This part's turbo cache: the newest one of this branch, else of main (a pull request can read its base's caches).
      - uses: actions/cache@v6
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ matrix.part }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.part }}-${{ runner.os }}-

      - run: ${{ matrix.run }}

      # Keep only the entries this commit's tasks used or made. Turbo never evicts, and each save carries the restored
      # cache forward, so without this it grows with every commit. Every task of the part runs in every check, so what
      # this run names is all a later run of the part can hit. Only after a passing run: a failed one stops early and
      # names too few, and the cache step saves nothing then anyway.
      - name: Prune turbo cache
        run: |
          hashes=$(jq -r '.tasks[].hash' .turbo/runs/*.json | sort -u)
          before=$(du -sh "$TURBO_CACHE_DIR" | cut -f1)
          for file in "$TURBO_CACHE_DIR"/*; do
            name=$(basename "$file")
            grep -qxF "${name%%[-.]*}" <<<"$hashes" || rm -f "$file"
          done
          echo "Turbo cache: $before → $(du -sh "$TURBO_CACHE_DIR" | cut -f1), $(wc -l <<<"$hashes") tasks kept"

  # The official MCP conformance suite against the core's scenario client and cloudpid's own MCP endpoint
  # (`packages/mcp/conformance`; `docs/architecture/mcp.md` → Testing and tracing → Conformance), once per mode: the spec
  # version picks the scenarios the runner starts, client then server.
  # A failure outside `baseline.json` fails the job, and so does a baseline entry that now passes, so the baseline only
  # shrinks; so does a side that ran no scenario. The runner is pinned to the SDK's own CI version
  # (`packages/mcp/package.json`), so it runs the same scenarios the SDK passes. A run takes seconds: the setup (install)
  # is the cost.
  conformance:
    name: Conformance (${{ matrix.mode }})
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: conformance-${{ matrix.mode }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      # Every mode reports, so one push shows every failure.
      fail-fast: false
      matrix:
        mode: ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
    steps:
      - uses: actions/checkout@v7

      # Bun, Node, Bun's packages (cached by lockfile, with a fallback), and the install.
      - uses: ./.github/actions/setup

      # `--cwd` after `run`: before it, Bun 1.4 prints its usage and exits 0, so every mode once passed without running a
      # scenario (#619). So the step also needs `run.ts`'s last line, with a scenario run on each side: a command that
      # never reaches `run.ts`, or a runner that runs nothing, fails it. `shell: bash` sets `pipefail`, so `tee` keeps
      # `run.ts`'s exit code.
      - shell: bash
        run: |
          bun run --cwd packages/mcp conformance "$MODE" | tee "$RUNNER_TEMP/conformance.log"
          grep -q "^Conformance ($MODE): [1-9][0-9]* client and [1-9][0-9]* server scenarios ran$" "$RUNNER_TEMP/conformance.log"
        env:
          MODE: ${{ matrix.mode }}

  # The one status the `main` ruleset requires (`Check`), and what the deploy jobs wait for: it passes only when every
  # part did, or for a docs-only change when `docs` did. It runs when one fails too (`!cancelled()`), so a failure
  # reports as one rather than as skipped, which a required check would count as passing.
  check:
    name: Check
    needs: [changes, checks, conformance, docs, manifests]
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then test "$CHECKS" = success -a "$CONFORMANCE" = success; else test "$DOCS" = success; fi
          # Skipped on a push and on a docs-only change, which have no manifest to guard.
          test "$MANIFESTS" = success -o "$MANIFESTS" = skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS: ${{ needs.checks.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          DOCS: ${{ needs.docs.result }}
          MANIFESTS: ${{ needs.manifests.result }}

  # Deploys `prod` on push to main with a scoped API token from the `production` environment
  # (credentials as code: infra/github.ts, docs/development/infra.md → CI credentials).
  deploy:
    name: Deploy prod
    needs: [changes, check]
    # `!cancelled()` and `check`'s own result, as `preview` has: without a status function the condition carries an
    # implicit `success()`, which also needs every job `check` waits on, and `docs` and `manifests` are skipped on a push,
    # so the deploy was skipped on every push.
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.code == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://pi.ianpascoe.dev
    # One deploy at a time; never cancel one midway.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # No dependency cache in a job holding deploy credentials (cache poisoning).
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: bun install --frozen-lockfile

      # The web app's build, as the stack's `WebBuild` step runs it (apps/server/src/web-build.ts), before the plan: on a
      # checkout without `dist` the step plans an update, which leaves its outputs unknown, so `Server` (whose assets they
      # are) updated on every deploy and reset every Session still busy 300 s later (#626). With `dist` built, an unchanged
      # app plans a noop, and so does `Server` when its bundle, assets and bindings are unchanged
      # (docs/development/infra.md → CI). No credentials here: the build runs the app's code and its tools.
      - name: Build the web app
        run: bun run build
        working-directory: apps/web

      # The deploy credentials are scoped to this step: install scripts never see them.
      - run: bun run deploy --stage prod --no-input --yes
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Bound to the Worker as secrets by the Session DO's `Config.Redacted` reads.
          MODEL_PROXY_URL: ${{ vars.MODEL_PROXY_URL }}
          MODEL_PROXY_API_KEY: ${{ secrets.MODEL_PROXY_API_KEY }}
          # The master key the Session DO encrypts the owner's Secrets under; read the same way, and required.
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          # Search keys, read by the web extension the same way. Both are set in `production`. A secret that is not set
          # reaches the stack as an empty string: `WebConfigLive` treats that as no key, but whether alchemy accepts an
          # empty secret binding is not verified, so set both (or remove the line of one you will never set).
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          # The GitHub App the Workers mint GitHub tokens from (ADR-0025; read by `Config.Redacted`, bound as Worker
          # secrets). Written into `production` and `preview` by `bun run github-app:setup` in `infra`.
          CLOUDPID_GITHUB_APP_ID: ${{ secrets.CLOUDPID_GITHUB_APP_ID }}
          CLOUDPID_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLOUDPID_GITHUB_APP_PRIVATE_KEY }}
          # The read-only analytics token the Workspace DO reads its Containers' usage with (optional; bound as a Worker
          # secret). Written into `production` and `preview` by infra/github.ts, not by hand.
          CLOUDPID_ANALYTICS_TOKEN: ${{ secrets.CLOUDPID_ANALYTICS_TOKEN }}
          # The VAPID identity Web Push messages are signed with (read by the Registry DO's `Config.Redacted`, bound as
          # Worker secrets): the public key also goes to the web app, which subscribes with it. Set in `production`.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

  # Publishes the `/cloudpid` pi extension (`packages/pi-cloudpid`) once `Deploy prod` has succeeded, so a laptop never
  # updates to an extension that is ahead of the endpoint it talks to (`docs/architecture/mcp-endpoint.md` → The
  # `/cloudpid` command → Distribution): it builds `dist/` and appends one commit naming the `main` SHA to the orphan
  # branch `pi-cloudpid`, which the owner installs with `pi install git:github.com/ian-pascoe/cloudpid@pi-cloudpid`.
  # It holds no deploy credentials and no environment, and `contents: write` reaches only the push step (the checkout
  # keeps no token, so install scripts never see it). It never force-pushes: a branch that moved meanwhile fails the push.
  # The build is not a turbo task here: turbo's cache would replay a `dist/` that has an older commit built in.
  pi-cloudpid:
    name: Publish pi-cloudpid
    needs: deploy
    # `!cancelled()`, as on `deploy`: without a status function the condition carries an implicit `success()`, which also
    # needs every job `deploy` waits on, and `docs` and `manifests` are skipped on a push, so this never ran.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time, in the order the deploys ran; never cancel one midway.
    concurrency:
      group: pi-cloudpid
      cancel-in-progress: false
    steps:
      # The whole history: the append step asks whether the branch already holds a build of a newer `main` commit.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # No dependency cache in a job that can write to the repository (cache poisoning).
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Only this package's dependencies (and the workspace packages it names): the job builds nothing else.
      - run: bun install --frozen-lockfile --filter @cloudpid/pi-cloudpid

      - run: bun run build
        working-directory: packages/pi-cloudpid
        env:
          PI_CLOUDPID_SHA: ${{ github.sha }}

      # A commit on top of the branch's tip with `dist/` as its whole tree (or the first commit of the orphan branch).
      - name: Append to the pi-cloudpid branch
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          publish="$RUNNER_TEMP/publish"
          mkdir "$publish"
          cd "$publish"
          git init --quiet --initial-branch=pi-cloudpid
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -c "http.extraheader=$auth" fetch --quiet --depth=1 origin pi-cloudpid; then
            # A rerun of an older run must not put an older build on top of a newer one: skip when the build at the tip
            # was made from a `main` commit that has this run's commit in its history.
            tip="$(git log -1 --format=%s FETCH_HEAD | sed -n 's/^pi-cloudpid: build of main \([0-9a-f]\{40\}\)$/\1/p')"
            if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
              git -C "$GITHUB_WORKSPACE" -c "http.extraheader=$auth" fetch --quiet origin main
              if git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$GITHUB_SHA" "$tip"; then
                echo "pi-cloudpid already has a build of $tip, which is newer than $GITHUB_SHA."
                exit 0
              fi
            fi
            git reset --quiet --soft FETCH_HEAD
          fi
          cp -R "$GITHUB_WORKSPACE/packages/pi-cloudpid/dist/." .
          git add --all
          if git diff --cached --quiet; then
            echo "pi-cloudpid already has this build."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "pi-cloudpid: build of main $GITHUB_SHA"
          git -c "http.extraheader=$auth" push origin pi-cloudpid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploys stage `pr-<number>` for a pull request from this repository, and destroys it when the pull request is closed
  # (https://alchemy.run/environments/ci/#how-pr-previews-work). Credentials come from the `preview` environment, which
  # any branch may use, each job once the owner has reviewed it, a deploy and a destroy alike (infra/github.ts;
  # docs/development/infra.md → CI credentials). It holds its own token, without the zone permissions only `prod` needs,
  # and its own copy of the app secrets. Pull requests from forks get no secrets, so they get no preview. The preview's
  # main Worker is `cloudpid-server-pr-<number>` (its app origin, apps/server/src/deployment.ts), and its deploy fails
  # unless it is served there.
  preview:
    name: Preview
    needs: [changes, check]
    # `check` is skipped on `closed`, so the destroy runs without it, when a preview was ever started; a deploy waits for
    # `check` to pass, and a docs-only change deploys none.
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' && needs.changes.outputs.preview != 'false'
        || needs.changes.outputs.code == 'true' && needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # The preview comment (GitHub.Comment in infra/alchemy.run.ts).
      pull-requests: write
    environment:
      name: preview
    # One deploy or destroy per pull request at a time, never cancelled midway: a newer push waits, and a close waits
    # for the running deploy, then destroys what it made. A deploy that only starts after the close (it waited for
    # `check`, the destroy did not) deploys nothing: see the first step.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # A push's deploy waits for `check` (minutes) but a close's destroy does not, so a pull request closed while its
      # last push is still being checked is destroyed first, when the stage is empty ("Plan: no resources"), and then
      # deployed by that push: a stage nothing destroys, left on the account (#328). The job holds the concurrency
      # group here, so a close that arrives after this check waits for the deploy and destroys it. The event's own
      # `pull_request.state` is the state at the push, so ask GitHub now.
      - name: Check the pull request is still open
        id: pull-request
        if: github.event.action != 'closed'
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != open ]; then echo "::notice::Pull request $PULL_REQUEST is $state: not deploying its preview."; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

      # A destroy evaluates the stack too: check out the commit that was last deployed, since the merge ref of a closed
      # pull request may be gone.
      - uses: actions/checkout@v7
        if: steps.pull-request.outputs.state != 'closed'
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      # Bun's packages are only read here, never written: this job holds deploy credentials. Reading them adds no trust a
      # preview did not already need: a pull request can read only its own caches (written by its `check` job, from the
      # code this job deploys) and main's. Bun trusts its cache, so a poisoned one is the risk: only `check` jobs of
      # this repository write it.
      - uses: ./.github/actions/setup
        if: steps.pull-request.outputs.state != 'closed'
        with:
          save-cache: "false"

      # The web app's build before the plan, as in `deploy`, so a push that changes nothing the Server is built from plans
      # `[Server] noop`. A destroy needs none.
      - name: Build the web app
        if: steps.pull-request.outputs.state != 'closed' && github.event.action != 'closed'
        run: bun run build
        working-directory: apps/web

      # The deploy credentials are scoped to this step: install scripts never see them. `destroy` evaluates the stack,
      # so it needs every variable `deploy` does (see the `deploy` job for what each is).
      - name: ${{ github.event.action == 'closed' && 'Destroy' || 'Deploy' }} pr-${{ github.event.pull_request.number }}
        if: steps.pull-request.outputs.state != 'closed'
        working-directory: infra
        run: >-
          bunx alchemy
          ${{ github.event.action == 'closed' && 'destroy' || 'deploy' }}
          --stage pr-${{ github.event.pull_request.number }} --no-input --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MODEL_PROXY_URL: ${{ vars.MODEL_PROXY_URL }}
          MODEL_PROXY_API_KEY: ${{ secrets.MODEL_PROXY_API_KEY }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          CLOUDPID_GITHUB_APP_ID: ${{ secrets.CLOUDPID_GITHUB_APP_ID }}
          CLOUDPID_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CLOUDPID_GITHUB_APP_PRIVATE_KEY }}
          CLOUDPID_ANALYTICS_TOKEN: ${{ secrets.CLOUDPID_ANALYTICS_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # Read by GitHub.GitHubEnv and GitHub.Comment (infra/alchemy.run.ts): the PR to comment on, and the token to
          # comment with.
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `alchemy destroy` passes when the state it reads is empty, whatever is left on the account, so check the account
      # itself: the stage's Container application (Cloudflare keeps it, with no instances, after its Worker is gone)
      # must be gone, or the job fails. Matches `cloudpid-*-pr-<number>` exactly, never another stage's or project's.
      - name: Check pr-${{ github.event.pull_request.number }} left no Container application
        if: github.event.action == 'closed'
        run: |
          apps=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications")
          jq -e '.success == true and (.result | type == "array")' <<<"$apps" >/dev/null \
            || { echo "::error::Cloudflare did not list the Container applications: $apps"; exit 1; }
          left=$(jq -r --arg stage "pr-$PULL_REQUEST" \
            '.result[] | select(.name | test("^cloudpid-.*-" + $stage + "(-[a-z0-9]+)?$")) | "\(.name) (\(.id))"' \
            <<<"$apps")
          if [ -n "$left" ]; then
            echo "::error::Stage pr-$PULL_REQUEST left Container applications on the account:"
            echo "$left"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

      # `alchemy destroy` swallows an error of an Access application's delete and drops its state row, so a failed one
      # leaves the application on the account: the Bypass application of the two public sign-in paths (#444, bypass-access.ts)
      # and the Hooks application of the Trigger URLs (#679, hooks-access.ts) are two. On a host with no script it reaches no Worker, but a reopened pull request would deploy into it, so delete
      # every application whose destinations are all public ones on this stage's host (`cloudpid-server-pr-<number>`
      # exactly, never another stage's or project's). A rerun finds none. It runs even when the destroy or the Container check failed:
      # those are the cases that leave a bypass behind. Fails only if a list or a delete fails.
      - name: Delete pr-${{ github.event.pull_request.number }}'s leftover Access applications
        if: always() && github.event.action == 'closed'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps"
          left=""
          page=1
          pages=1
          while [ "$page" -le "$pages" ]; do
            apps=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100&page=$page")
            jq -e '.success == true and (.result | type == "array")' <<<"$apps" >/dev/null \
              || { echo "::error::Cloudflare did not list the Access applications: $apps"; exit 1; }
            pages=$(jq -r '.result_info.total_pages // 1' <<<"$apps")
            left+=$(jq -r --arg stage "pr-$PULL_REQUEST" '
              .result[]
              | select((.destinations // []) | length > 0 and all(
                  .type == "public"
                  and (.uri | sub("^https?://"; "") | split("/")[0] | test("^cloudpid-server-" + $stage + "\\.[a-z0-9-]+\\.workers\\.dev$"))))
              | "\(.id) \(.name)"' <<<"$apps")$'\n'
            page=$((page + 1))
          done
          failed=0
          while read -r id name; do
            [ -n "$id" ] || continue
            echo "Deleting Access application $name ($id)"
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$id" | jq -e '.success == true' >/dev/null \
              || { echo "::error::Could not delete Access application $name ($id)"; failed=1; }
          done <<<"$left"
          exit "$failed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
