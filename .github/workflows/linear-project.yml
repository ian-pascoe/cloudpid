# Puts each new GitHub issue's Linear copy into this repo's Linear project (LINEAR_PROJECT below; scripts/linear-project.sh). Linear's GitHub
# Issues sync copies the issue into the team SPI but into no project, and agents read issues by project
# (docs/agents/issue-tracker.md). It runs for `cloudpid-report` issues too: the GitHub App opens them, and an issue
# opened by an App starts workflows (one opened with GITHUB_TOKEN would not). A dispatch takes an issue number, to retry
# one whose run failed; an issue opened before the sync existed has no copy to move. Needs the repository secret
# LINEAR_API_KEY: a Linear API key that may edit SPI's issues.
name: linear project

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: GitHub issue number
        required: true
        type: number

permissions: {}

concurrency:
  group: linear-project-${{ github.event.issue.number || inputs.issue }}

jobs:
  project:
    name: project
    # Forks have neither the secret nor the Linear project.
    if: github.repository == 'ian-pascoe/cloudpid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # sparse checkout of the script
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/linear-project.sh
          sparse-checkout-cone-mode: false
      - name: Add to the project
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # This repo's Linear project (team SPI), by id: its name can change.
          LINEAR_PROJECT: c5b4ec54-51b3-4742-88a1-0a75c7c646a8
          ISSUE_URL: ${{ github.event.issue.html_url || format('{0}/{1}/issues/{2}', github.server_url, github.repository, inputs.issue) }}
        run: scripts/linear-project.sh
