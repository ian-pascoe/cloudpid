name: Set up Vite+ and dependencies
description: >-
  Vite+ (the `vite-plus` version in the root package.json, so the global `vp` runs the project's own toolchain), the
  Node.js it manages, pnpm (the version in package.json's `packageManager`), and `vp install --frozen-lockfile`.
  pnpm's store is cached by the lockfile. With `save-cache: false` the cache is only read, for jobs that hold deploy
  credentials.

inputs:
  save-cache:
    description: Write the store back to the cache when the lockfile's key missed (`false` only restores).
    default: "true"

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1.22.0
      with:
        version-file: package.json
        node-version: lts
        cache: true
        cache-save: ${{ inputs.save-cache }}
        run-install: |
          - args: ["--frozen-lockfile"]
